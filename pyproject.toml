[project]
name = "guardrail-erosion-audit"
version = "0.1.0"
description = "Reproduction code for a paired audit of biomedical model abstention"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pyarrow==19.0.1",
  "scipy==1.16.0",
]

[project.optional-dependencies]
inference-l40s = ["vllm==0.26.0"]
inference-h100 = ["vllm==0.27.1"]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "inference-l40s" },
    { extra = "inference-h100" },
  ],
]
